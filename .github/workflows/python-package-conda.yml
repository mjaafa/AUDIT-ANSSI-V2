name: Python Package using Conda

on: [push]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base
    - name: Lint with flake8
      run: |
        conda install flake8
        # stop the build if there are Python syntax errors or undefined names
        #flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        #flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        
        #python -m pytest --collect-only -v
        pip install -r requirements.txt
        python -m pip install --upgrade anyio pytest
        whoami
        sudo ls
        # The runner user has no password: audit localhost over SSH with a throwaway key
        sudo apt-get install -y openssh-server
        sudo systemctl start ssh
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ci -q
        cat ~/.ssh/id_ci.pub >> ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/authorized_keys
        python3 tester-ssh.py "$(whoami)" --key ~/.ssh/id_ci --port 22 --non-interactive --out report-ubuntu
    - name: Commit audit report
      if: always()
      run: |
        if [ ! -d report-ubuntu ]; then echo "No report generated"; exit 0; fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -f report-ubuntu
        if git diff --cached --quiet; then echo "No report changes"; exit 0; fi
        git commit -m "[ ANSSI ] audit report ${GITHUB_SHA::7} [skip ci]"
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push origin "HEAD:${GITHUB_REF_NAME}"
